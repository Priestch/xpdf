[package]
name = "pdf-x-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "A Rust port of PDF.js with progressive loading support"

[dependencies]
# Workspace dependencies
rustc-hash = { workspace = true }
smallvec = { workspace = true }
lru = { workspace = true }
flate2 = { workspace = true }

# Adobe Glyph List (static perfect hash, compile-time)
phf = { workspace = true }

# Optional dependencies
# (reqwest/tokio removed — HTTP I/O belongs in the shell per decision A.
# See archive/shell-http-impls/ for the reference implementation.)

# Crypto dependencies (SHA-2 is optional, AES is now built-in)
sha2 = { version = "0.10", optional = true }

# Optional image decoding
zune-jpeg = { workspace = true, optional = true }
image = { workspace = true, optional = true }
hayro-jpeg2000 = { path = "../hayro/hayro-jpeg2000", optional = true, default-features = false }
hayro-jbig2 = { path = "../hayro/hayro-jbig2", optional = true, default-features = false }

# NOTE: the tiny-skia rendering backend (tiny-skia / rustybuzz / ttf-parser /
# hayro-font) moved to the `pdf-x-device-tinyskia` adapter crate (Phase 0 step 5).
# The core is now backend-free; `cargo build -p pdf-x-core --no-default-features`
# links none of them.

[features]
default = ["jpeg-decoding"]
jpeg-decoding = ["zune-jpeg"]
png-decoding = ["image"]
advanced-image-formats = ["hayro-jpeg2000", "hayro-jbig2"]
crypto = ["sha2"]  # AES implementation is now built-in, only SHA-2 is external
# Backend-agnostic rendering surface (Device trait, RenderingContext, `interpret`) is
# always compiled (no external deps). The tiny-skia backend now lives in
# `pdf-x-device-tinyskia`. This feature is retained as a marker so existing
# `required-features = ["rendering"]` test targets keep working unchanged.
rendering = []
debug-logging = []  # Enable verbose debug logging for rendering operations

[dev-dependencies]
tempfile = "3.14"
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.5"
hex = "0.4"
# Isolated PNG codec for the golden render-output regression harness.
# Acceptable per CLAUDE.md (isolated-operation codec; no full-file PDF dependency).
png = "0.17"
# The tiny-skia backend lives in its own adapter crate now; core's pixel-rendering
# integration tests depend on it here (test-only — not a core hard-dep).
pdf-x-device-tinyskia = { path = "../pdf-x-device-tinyskia" }
# Test-only: several rendering tests build a `tiny_skia::Pixmap` directly. It is not
# a core hard-dep (it ships in the adapter crate); listed here so tests compile.
tiny-skia = "0.11"

[[bench]]
name = "parsing"
harness = false

[[test]]
name = "rendering_tests"
path = "tests/rendering_tests.rs"
required-features = ["rendering"]

[[test]]
name = "render_pdf_example"
path = "tests/render_pdf_example.rs"
required-features = ["rendering"]

[[test]]
name = "coordinate_transform_test"
path = "tests/coordinate_transform_test.rs"
required-features = ["rendering"]

[[test]]
name = "image_rendering_test"
path = "tests/image_rendering_test.rs"
required-features = ["rendering"]

[[test]]
name = "render_golden"
path = "tests/render_golden.rs"
required-features = ["rendering", "crypto"]

[[test]]
name = "encryption_tests"
path = "tests/encryption_tests.rs"
required-features = ["crypto"]

[[example]]
name = "render"
path = "examples/render.rs"
required-features = ["rendering"]
